# Stratum master data: canonical entities, metrics, units and source precedence.
# Aliases are matched case-insensitively on normalised text (punctuation → space).

entities:
  # code: canonical code stored on facts; type drives grouping ("subsidiary-wise").
  - {code: ECL,  type: subsidiary, name: Eastern Coalfields Limited,        parent: CIL, aliases: [ecl, eastern coalfields, eastern coalfields ltd, eastern coalfields limited, ईसीएल]}
