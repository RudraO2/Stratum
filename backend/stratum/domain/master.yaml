metrics:
  # key: canonical metric; unit: canonical unit; range: plausible [min,max] per entity-year in the canonical unit
  - {key: coal_production,   unit: million_tonnes,       label: Coal production,           aliases: [coal production, production, raw coal production, output, coal output, produced], range: [0, 1300]}
  - {key: coal_offtake,      unit: million_tonnes,       label: Coal offtake / despatch,   aliases: [offtake, off take, off-take, despatch, dispatch, coal despatch, coal dispatch, coal offtake, raw coal offtake, supply], range: [0, 1300]}
  - {key: obr,               unit: million_cubic_metres, label: Overburden removal,        aliases: [overburden removal, over burden removal, obr, ob removal, overburden], range: [0, 3000]}
  - {key: production_target, unit: million_tonnes,       label: Production target,         aliases: [production target, target, target production, aap target, annual target], range: [0, 1600]}
  - {key: offtake_target,    unit: million_tonnes,       label: Offtake target,            aliases: [offtake target, despatch target, dispatch target], range: [0, 1600]}
  - {key: capacity,          unit: million_tonnes_per_annum, label: Capacity,              aliases: [capacity, rated capacity, sanctioned capacity, production capacity], range: [0, 2000]}
  - {key: reserves,          unit: million_tonnes,       label: Coal reserves,             aliases: [reserves, extractable reserves, mineable reserves, geological reserves], range: [0, 400000]}
  - {key: resources,         unit: million_tonnes,       label: Coal resources,            aliases: [resources, coal resources, geological resources, total resources], range: [0, 500000]}
  - {key: manpower,          unit: persons,              label: Manpower,                  aliases: [manpower, employees, man power, employee strength], range: [0, 800000]}
  - {key: oms,               unit: tonnes_per_manshift,  label: Output per man-shift (OMS), aliases: [oms, output per man shift, output per manshift], range: [0, 100]}
  - {key: exploration_drilling, unit: metres,            label: Exploratory drilling,      aliases: [drilling, exploratory drilling, exploration drilling, meterage], range: [0, 5000000]}
  - {key: growth_pct,        unit: percent,              label: Growth,                    aliases: [growth, growth percent, growth pct, "% growth", growth over last year, "% change", change], range: [-100, 1000]}
  - {key: achievement_pct,   unit: percent,              label: Achievement,               aliases: ["% achievement", achievement, achievement pct, "% of target"], range: [0, 300]}

units:
  # alias → [canonical unit, factor to multiply by]
  million_tonnes:       [[mt, "m t", mts, million tonnes, million tonne, million ton, million tons, mill tonnes, "in mt", "in million tonnes", "mill. tonnes", "mn tonnes", "mn t"], 1.0]
  lakh_tonnes:          [[lt, lakh tonnes, lakh tonne, lakh ton, "in lakh tonnes", lakh t], 0.1, million_tonnes]
  thousand_tonnes:      [["'000 tonnes", "000 tonnes", thousand tonnes, "th tonnes", "'000 t", kt], 0.001, million_tonnes]
  tonnes:               [[tonnes, tonne, tons, "t"], 0.000001, million_tonnes]
  million_cubic_metres: [[mcum, m cum, million cubic metres, million cubic meters, mm3, "mcu m", "m. cum", million cum, "m cu m", "m.cu.m", "mcu.m"], 1.0]
  lakh_cubic_metres:    [[lcum, lakh cubic metres, lakh cum], 0.1, million_cubic_metres]
  million_tonnes_per_annum: [[mtpa, million tonnes per annum, "mty", "mt/year"], 1.0]
  percent:              [["%", percent, per cent, percentage], 1.0]
  persons:              [[persons, nos, numbers, number, employees], 1.0]
  tonnes_per_manshift:  [["t/ms", tonnes per manshift, "te/manshift"], 1.0]
  metres:               [[metres, meters, "m"], 1.0]

# Which document kind wins when two sources disagree on the same fact.
source_precedence:
  human_review: 100
  coal_directory: 90
  annual_report: 80
  provisional_stats: 70
  spreadsheet: 60
  pq_reply: 55
  geological_report: 55
  document: 50
  press_release: 40

stopwords_domain: [coal, india, limited, ltd, ministry, government, total, year, per, cent, lakh, million, tonnes, tonne, mt, fy, also, shall, will, may, said, state, states, company, subsidiary, subsidiaries, page, table, annexure, annex, sl, "no", nos, s, reply, question, answer, minister, lok, sabha, rajya, unstarred, starred, shri, smt, dated, hon, ble, part, figures, provisional, respectively, etc, i, ii, iii, iv, v, sample, excerpt, synthetic, demonstration, approximate, published]
