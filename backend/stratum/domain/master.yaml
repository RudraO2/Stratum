  - {code: CMPDI, type: subsidiary, name: Central Mine Planning & Design Institute, parent: CIL, aliases: [cmpdi, cmpdil, central mine planning and design institute, central mine planning design institute]}
  - {code: CIL,  type: company, name: Coal India Limited, aliases: [cil, coal india, coal india ltd, coal india limited, total cil, cil total, cil total coal, coal india total, कोल इंडिया, सीआईएल]}
