<?xml version="1.0" encoding="UTF-8"?>
<!-- The Stratum mark as the browser favicon: dark ink, light ink in a dark tab strip (one file, both themes). Geological layers: a solid top stratum over two lines of rock - the layers evidence -> facts -> answers are built in. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 44" width="96" height="88" role="img" aria-label="Stratum">
	<title>Stratum</title>
	<style>
		.ink { fill: #0b1220; } .line { stroke: #0b1220; }
		@media (prefers-color-scheme: dark) { .ink { fill: #f4f6fb; } .line { stroke: #f4f6fb; } }
	</style>
	<path d="M24 4 L44 13 L24 22 L4 13 Z" class="ink"/>
	<path d="M4 20.5 L24 29.5 L44 20.5 M4 28.5 L24 37.5 L44 28.5" fill="none" class="line" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
