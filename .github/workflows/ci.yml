# The gate this project claims.
#
# Two suites, both runnable by anyone on any box in about a minute: no GPU, no model weights, no
# harness install.
#
#   plugin   Node's built-in test runner over plugins/stratum-ui: the lanes, the tools, the loopback-only
#            proxy, and every tab and card rendered against fixtures captured from the real backend.
#   backend  pytest over the deterministic core: number / period / unit parsing, the number guard, the
#            "LLM maps, code extracts" path on tables shaped like the real ones, PQ header parsing and
#            the question router. These need only pyyaml and httpx — the heavy parsers (Docling) and the
#            models are exercised locally, where the GPU is.
#
# The permissive-licence audit (`npm run licence-audit`) reads the Python environment the backend
# actually runs in, so it runs on the machine that has one, not here.
#
# Windows is in the matrix deliberately: Stratum ships for a Windows laptop and the target should be
# exercised; Ubuntu is the fast path.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Pinned to the floor in package.json's `engines`, not to `latest`: the harness is a developer
      # preview and the version this was verified against is the version worth testing against.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      # This repository has no npm dependencies, which is itself part of the claim.
      - run: npm test

  backend:
    name: backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml httpx pytest
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          STRATUM_HOME: ${{ runner.temp }}/stratum
